<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gartenstudio Männedorf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Gartenstudio Männedorf – modern, hell, Zürichsee-Blau + Salbei. iOS-15-tauglich: kein :has(), kein light-dark() */
:root{--bg:#f5f6f3;--card:#fff;--ink:#14212b;--soft:#5b6873;--lake:#1d5c86;--deep:#14324a;--sage:#8fae96;--sand:#e9e4da;--line:#e3e6e2;--acc:#e0795a}
@media (prefers-color-scheme:dark){:root{--bg:#0e161d;--card:#16222c;--ink:#eef2f5;--soft:#a3b1bc;--line:#24323d;--sand:#1c2a35}}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 Inter,-apple-system,Helvetica,Arial,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Manrope,-apple-system,Helvetica,sans-serif;line-height:1.12;margin:0;letter-spacing:-.01em}
a{color:inherit}
button{font:inherit;cursor:pointer}
/* Hero */
.hero{position:relative;min-height:min(78vh,640px);color:#fff;display:flex;align-items:flex-end;overflow:hidden;background:var(--deep)}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease,transform 9s ease;transform:scale(1.06)}
.slide.on{opacity:1;transform:scale(1)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:75%;background:linear-gradient(180deg,rgba(20,50,74,0) 0%,rgba(20,50,74,.55) 45%,rgba(14,28,40,.92) 100%)}
.htop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px max(4vw,16px);z-index:2}
.brand{font:800 15px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;background:rgba(14,28,40,.45);padding:10px 14px;border-radius:30px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.langs{display:flex}
.langs button{background:rgba(255,255,255,.88);color:var(--deep);border:0;border-radius:22px;min-width:46px;min-height:42px;margin-left:6px;font-weight:600}
.langs button.on{background:var(--acc);color:#fff}
.hin{position:relative;z-index:2;padding:0 max(4vw,18px) 34px;max-width:1240px;width:100%;margin:0 auto}
.hi{font:700 15px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#bfe0d0}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:800;margin:8px 0 10px}
.hero p{margin:0;max-width:36em;color:#dbe6ee;font-size:17.5px}
.facts{display:flex;flex-wrap:wrap;margin-top:18px}
.facts span{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);border-radius:30px;padding:7px 14px;margin:0 8px 8px 0;font-size:14.5px;font-weight:600}
.dots{display:flex;margin-top:10px}
.dots i{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);margin-right:6px}
.dots i.on{background:#fff}
/* Kacheln */
.band{padding:28px max(4vw,16px) 12px;max-width:1240px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-decoration:none;min-height:96px;transition:transform .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,50,74,.10)}
.tile:active{transform:scale(.98)}
.ico{flex:none;width:52px;height:52px;border-radius:16px;margin-right:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--lake),var(--deep))}
.ico svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile h3{font-size:19px}
.tile p{margin:3px 0 0;color:var(--soft);font-size:14.5px;line-height:1.35}
/* Unterseiten */
.view{display:none}.view.on{display:block}
.top{display:flex;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.back{font-weight:600;background:var(--deep);color:#fff;border:0;border-radius:24px;padding:11px 20px;min-height:46px;margin-right:16px;text-decoration:none}
.top h2{font-size:32px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;position:relative}
.c h3{font-size:19px;margin:0 46px 6px 0}
.c p{margin:0;color:var(--soft)}
.addr{font-size:14.5px;margin-top:6px;color:var(--soft)}
.tag{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--lake);background:var(--sand);padding:3px 10px;border-radius:12px}
.links a{display:inline-block;margin:12px 10px 0 0;background:var(--lake);color:#fff;text-decoration:none;font-weight:600;padding:9px 18px;border-radius:22px;min-height:42px}
.fav{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--bg);font-size:21px;line-height:1;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:2px solid var(--lake);background:transparent;color:var(--ink);padding:8px 17px;min-height:44px;border-radius:24px;margin:0 10px 8px 0;font-weight:600}
.chips button.on{background:var(--lake);color:#fff}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 16px}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px 16px 72px;margin-bottom:12px;position:relative;color:var(--soft)}
.steps li::before{content:counter(s);position:absolute;left:18px;top:16px;width:38px;height:38px;border-radius:19px;background:var(--acc);color:#fff;font:800 18px/38px Manrope,sans-serif;text-align:center}
.steps b{display:block;font:700 18px Manrope,sans-serif;color:var(--ink);margin-bottom:2px}
.steps a{color:var(--lake);font-weight:600}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gal a{display:block;border-radius:16px;overflow:hidden;background:var(--sand);aspect-ratio:4/3}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.gal a:hover img{transform:scale(1.04)}
.lb{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,16,22,.94);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:10px}
.lb button{position:absolute;top:14px;right:14px;width:48px;height:48px;border-radius:24px;border:0;background:#fff;color:var(--deep);font-size:24px}
.sos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.sos a{background:var(--acc);color:#fff;border-radius:18px;padding:14px;text-align:center;text-decoration:none}
.sos b{display:block;font:800 36px/1.1 Manrope,sans-serif}
.more{margin-top:16px;color:var(--soft)}
.empty{color:var(--soft);padding:20px 0}
.foot{text-align:center;color:var(--soft);font-size:14px;padding:22px 16px 30px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sos{grid-template-columns:repeat(2,minmax(0,1fr))}.gal{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.hero{min-height:72vh}.hero::after{height:100%;background:linear-gradient(180deg,rgba(20,50,74,.15) 0%,rgba(20,50,74,.6) 40%,rgba(14,28,40,.94) 100%)}.brand{display:none}.htop{justify-content:flex-end;padding:12px}.langs button{min-width:42px;min-height:40px;margin-left:5px}.hi{color:#d4efe2}.grid,.cards{grid-template-columns:minmax(0,1fr)}.top h2{font-size:26px}.tile{min-height:84px}}
@media (prefers-reduced-motion:reduce){.slide{transition:none;transform:none}}
</style>
</head>

let lang = "de", favs = [], filt = {trips:"l", food:"all", shop:"all"};
try { favs = JSON.parse(localStorage.getItem("mf_favs") || "[]"); lang = localStorage.getItem("mf_lang") || ""; } catch(e) {}
if (L.indexOf(lang) < 0) { const n = (navigator.language || "de").slice(0,2); lang = L.indexOf(n) >= 0 ? n : "en"; }
const li = () => L.indexOf(lang);
const save = () => { try { localStorage.setItem("mf_favs", JSON.stringify(favs)); localStorage.setItem("mf_lang", lang); } catch(e) {} };

function cards(arr, l) {
  return `<div class="cards">${arr.map(c => `<div class="c"><h3>${c[0][l]}</h3><p>${c[1][l]}</p>${c[2] ? `<div class="links"><a href="${c[2]}">${c[2].indexOf("wa.me") >= 0 ? "WhatsApp" : c[2].indexOf("google.com/maps") >= 0 ? UI.map[l] : UI.web[l]}</a></div>` : ""}</div>`).join("")}</div>`;
}
function place(p, l, kind) {
  const isT = kind === "trips";
  const txt = isT ? p[3][l] : p[4][l], url = isT ? p[4] : p[5];
  const mapq = isT ? p[5] : p[2] + " " + p[3] + " Männedorf";
  const on = favs.indexOf(p[0]) >= 0;
  return `<div class="c"><button class="fav" data-f="${p[0]}" aria-label="favorite">${on ? "♥" : "♡"}</button><h3>${p[2]}</h3><p>${txt}</p>${isT ? "" : `<div class="addr">${p[3]}</div><span class="tag">${p[1]}</span>`}<div class="links"><a href="${Q(mapq)}">${UI.map[l]}</a>${url ? `<a href="${url}">${UI.web[l]}</a>` : ""}</div></div>`;
}
function list(kind, l) {
  const data = kind === "trips" ? TRIPS : kind === "food" ? FOOD : SHOP;
  let chips, items;
  if (kind === "trips") {
    chips = [["l",UI.lake[l]],["n",UI.nature[l]],["c",UI.city[l]],["r",UI.rain[l]],["fav",UI.favs[l]]];
    items = filt.trips === "fav" ? data.filter(p => favs.indexOf(p[0]) >= 0) : data.filter(p => p[1] === filt.trips);
  } else {
    chips = [["all",UI.all[l]],["fav",UI.favs[l]]];
    items = filt[kind] === "fav" ? data.filter(p => favs.indexOf(p[0]) >= 0) : data;
  }
  const cur = filt[kind];
  const ch = `<div class="chips">${chips.map(c => `<button data-k="${kind}" data-v="${c[0]}" class="${cur === c[0] ? "on" : ""}">${c[1]}</button>`).join("")}${cur === "fav" && items.length ? `<button data-clear="1">${UI.clear[l]}</button>` : ""}</div>`;
  return ch + (items.length ? `<div class="cards">${items.map(p => place(p, l, kind)).join("")}</div>` : `<p class="empty">${UI.nofav[l]}</p>`);
}

function render() {
  const l = li();
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = UI[e.dataset.t][l]; });
  document.getElementById("langs").innerHTML = L.map(x => `<button data-lang="${x}" class="${x === lang ? "on" : ""}">${LN[x]}</button>`).join("");
  document.getElementById("facts").innerHTML = UI.facts[l].map(f => `<span>${f}</span>`).join("");
  document.getElementById("tiles").innerHTML = TILES.map(t => `<a class="tile" href="#${t[0]}"><span class="ico"><svg viewBox="0 0 24 24">${t[1]}</svg></span><div><h3>${t[2][l]}</h3><p>${t[3][l]}</p></div></a>`).join("");
  route(false);
}
function route(scroll) {
  const h = (location.hash || "").replace("#", "");
  const t = TILES.filter(x => x[0] === h)[0];
  document.getElementById("v-start").classList.toggle("on", !t);
  document.getElementById("v-page").classList.toggle("on", !!t);
  if (t) {
    document.getElementById("ptitle").textContent = t[2][li()];
    document.getElementById("pbody").innerHTML = PAGES[h](li());
  }
  if (scroll !== false) window.scrollTo(0, 0);
}

const lb = document.getElementById("lb");
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-lb]");
  if (a) { e.preventDefault(); lb.querySelector("img").src = a.dataset.lb; lb.classList.add("on"); return; }
  if (e.target.closest("#lb")) { lb.classList.remove("on"); return; }
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.lang) { lang = b.dataset.lang; save(); render(); }
  else if (b.dataset.f) { const i = favs.indexOf(b.dataset.f); if (i >= 0) favs.splice(i, 1); else favs.push(b.dataset.f); save(); route(false); }
  else if (b.dataset.k) { filt[b.dataset.k] = b.dataset.v; route(false); }
  else if (b.dataset.clear) { favs = []; save(); route(false); }
});
window.addEventListener("hashchange", () => route(true));
render();

/* Fotos im Kopfbereich wechseln alle 6 Sek. */
const sl = document.querySelectorAll(".slide"), dots = document.getElementById("dots");
dots.innerHTML = Array.prototype.map.call(sl, (s, i) => `<i class="${i ? "" : "on"}"></i>`).join("");
let si = 0;
setInterval(() => { sl[si].classList.remove("on"); dots.children[si].classList.remove("on"); si = (si + 1) % sl.length; sl[si].classList.add("on"); dots.children[si].classList.add("on"); }, 6000);
})();
</script>
