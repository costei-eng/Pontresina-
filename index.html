<style>
/* Entwurf 2 – Layout/Farben folgen später. iOS-15-tauglich: kein light-dark(), kein :has(), keine Container Queries */
:root{--bg:#f6f3ee;--card:#fff;--ink:#1c2a25;--soft:#55635d;--pine:#1f3d33;--ice:#2f8f8a;--red:#b8402f;--line:#e2ddd4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a16;--card:#18261f;--ink:#eef2ef;--soft:#a9b7b0;--pine:#2c5446;--line:#2a3a33}}
:root[data-theme=dark]{--bg:#0f1a16;--card:#18261f;--ink:#eef2ef;--soft:#a9b7b0;--pine:#2c5446;--line:#2a3a33}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",-apple-system,Helvetica,Arial,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Josefin Sans",-apple-system,Helvetica,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
.hero{background:var(--pine);color:#fff;display:flex;min-height:300px}
.greet{flex:1 1 46%;padding:28px max(4vw,20px);display:flex;flex-direction:column;justify-content:center}
.hi{font-family:"Josefin Sans",sans-serif;color:#f2c9bf;font-size:20px;margin-bottom:6px}
.greet h1{font-size:44px}
.greet p{margin:12px 0 0;color:#d8e4de;max-width:30em}
.clock{margin-top:18px;display:flex;align-items:baseline;flex-wrap:wrap}
.clock b{font-family:"Josefin Sans",sans-serif;font-size:48px;line-height:1;margin-right:14px}
.clock span{color:#d8e4de}
.scene{flex:1 1 54%;position:relative;min-height:300px}
.scene svg{position:absolute;top:0;left:0;width:100%;height:100%}
.poster{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;transition:opacity 1.6s ease}.poster.on{opacity:1}
.cap{position:absolute;left:22px;bottom:16px;font-family:"Josefin Sans",Helvetica,sans-serif;line-height:1}.cap b{display:block;font-size:clamp(28px,4.4vw,44px);letter-spacing:.12em}.cap span{display:block;margin-top:6px;font-weight:600;font-size:13px;letter-spacing:.2em}
.scene{cursor:pointer}
.langs{position:absolute;top:14px;right:14px;display:flex;z-index:2}
.langs button{background:rgba(255,255,255,.85);color:#1f3d33;border:0;border-radius:22px;min-width:48px;min-height:44px;margin-left:8px;font-weight:600}
.langs button.on{background:#b8402f;color:#fff}
.band{padding:24px max(4vw,16px);max-width:1240px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-decoration:none;min-height:100px;-webkit-tap-highlight-color:transparent}
.tile:active{transform:scale(.97)}
.ico{flex:none;width:50px;height:50px;border-radius:14px;margin-right:14px;display:flex;align-items:center;justify-content:center;background:var(--pine)}
.ico svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile h3{font-size:21px}
.tile p{margin:3px 0 0;color:var(--soft);font-size:15px;line-height:1.3}
.view{display:none}.view.on{display:block}
.top{display:flex;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.back{font-weight:600;background:var(--pine);color:#fff;border:0;border-radius:24px;padding:11px 22px;min-height:48px;margin-right:16px;text-decoration:none}
.top h2{font-size:34px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative}
.c h3{font-size:20px;margin:0 46px 6px 0}
.c p{margin:0;color:var(--soft)}
.addr{font-size:15px;margin-top:6px;color:var(--soft)}
.tag{display:inline-block;margin-top:8px;font-size:14px;font-weight:600;color:var(--ice)}
.links a{display:inline-block;margin:10px 10px 0 0;background:var(--ice);color:#fff;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:22px;min-height:44px}
.fav{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);font-size:22px;line-height:1;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:2px solid var(--pine);background:transparent;color:var(--ink);padding:9px 18px;min-height:46px;border-radius:24px;margin:0 10px 8px 0;font-weight:600}
.chips button.on{background:var(--pine);color:#fff}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px 14px 70px;margin-bottom:12px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:16px;top:14px;width:40px;height:40px;border-radius:20px;background:var(--red);color:#fff;font:700 20px/40px "Josefin Sans",sans-serif;text-align:center}
.steps b{display:block;font-size:18px}
.steps img{display:block;width:100%;max-width:760px;margin-top:10px;border-radius:10px;border:1px solid var(--line);background:#fff}
ul{margin:6px 0 0;padding-left:20px;color:var(--soft)}li{margin:3px 0}
.big{font-family:"Josefin Sans",sans-serif;font-size:24px;color:var(--ink)}
.todo{color:var(--red);font-size:14px;font-weight:600}
.sos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.sos div{background:var(--red);color:#fff;border-radius:16px;padding:14px;text-align:center}
.sos b{display:block;font:700 38px/1.1 "Josefin Sans",sans-serif}
.more{margin-top:16px;color:var(--soft)}
.empty{color:var(--soft);padding:20px 0}
.foot{text-align:center;color:var(--soft);font-size:14px;padding:8px 16px 28px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.hero{flex-direction:column-reverse}.scene{min-height:200px}.greet h1{font-size:32px}.grid,.cards{grid-template-columns:minmax(0,1fr)}.top h2{font-size:27px}}
@media (prefers-reduced-motion:reduce){.poster{transition:none}}
</style>
</head>

    [["Hauswartung · Ersatzschlüssel","Caretaker · spare key","Custode · chiave di riserva","Concierge · clé de secours"],["Frau Ana Corona · 081 842 60 74 oder 079 569 32 65","Ms Ana Corona · +41 81 842 60 74 or +41 79 569 32 65","Sig.ra Ana Corona · +41 81 842 60 74 o +41 79 569 32 65","Mme Ana Corona · +41 81 842 60 74 ou +41 79 569 32 65"]],

let lang = "de", favs = [], filt = {trips:null, food:"all", shop:"all"};
try { favs = JSON.parse(localStorage.getItem("pf_favs") || "[]"); lang = localStorage.getItem("pf_lang") || ""; } catch(e) {}
if (L.indexOf(lang) < 0) { const n = (navigator.language || "de").slice(0,2); lang = L.indexOf(n) >= 0 ? n : (n === "rm" ? "de" : "en"); }
const li = () => L.indexOf(lang);
const save = () => { try { localStorage.setItem("pf_favs", JSON.stringify(favs)); localStorage.setItem("pf_lang", lang); } catch(e) {} };

function cards(arr, l) {
  return `<div class="cards">${arr.map(c => `<div class="c"><h3>${c[0][l]}</h3><p>${c[1][l]}${c[2] ? ` <span class="todo">– ${UI.todo[l]}</span>` : ""}</p>${c[3] ? `<div class="links"><a href="${c[3]}">${UI.web[l]}</a></div>` : ""}</div>`).join("")}</div>`;
}
function place(p, l, kind) {
  const isT = kind === "trips";
  const name = isT ? p[2] : p[2], txt = isT ? p[3][l] : p[4][l], url = isT ? p[4] : p[5];
  const addr = isT ? "" : `<div class="addr">${p[3]}</div>`;
  const tag = isT ? "" : `<span class="tag">${p[1]}</span>`;
  const on = favs.indexOf(p[0]) >= 0;
  return `<div class="c"><button class="fav" data-f="${p[0]}" aria-label="favorite">${on ? "♥" : "♡"}</button><h3>${name}</h3><p>${txt}</p>${addr}${tag}<div class="links"><a href="${Q(name + " " + (isT ? "Engadin" : p[3] + " Pontresina"))}">${UI.map[l]}</a>${url ? `<a href="${url}">${UI.web[l]}</a>` : ""}</div></div>`;
}
function list(kind, l) {
  const data = kind === "trips" ? TRIPS : kind === "food" ? FOOD : SHOP;
  let chips, items;
  if (kind === "trips") {
    if (!filt.trips) { const m = new Date().getMonth(); filt.trips = (m >= 4 && m <= 9) ? "s" : "w"; }
    chips = [["w",UI.winter[l]],["s",UI.summer[l]],["r",UI.rain[l]],["fav",UI.favs[l]]];
    items = filt.trips === "fav" ? data.filter(p => favs.indexOf(p[0]) >= 0) : data.filter(p => p[1] === filt.trips);
  } else {
    chips = [["all",UI.all[l]],["fav",UI.favs[l]]];
    items = filt[kind] === "fav" ? data.filter(p => favs.indexOf(p[0]) >= 0) : data;
  }
  const cur = filt[kind];
  const ch = `<div class="chips">${chips.map(c => `<button data-k="${kind}" data-v="${c[0]}" class="${cur === c[0] ? "on" : ""}">${c[1]}</button>`).join("")}${cur === "fav" && items.length ? `<button data-clear="1">${UI.clear[l]}</button>` : ""}</div>`;
  return ch + (items.length ? `<div class="cards">${items.map(p => place(p, l, kind)).join("")}</div>` : `<p class="empty">${UI.nofav[l]}</p>`);
}

function render() {
  const l = li();
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = UI[e.dataset.t][l]; });
  document.getElementById("langs").innerHTML = L.map(x => `<button data-lang="${x}" class="${x === lang ? "on" : ""}">${LN[x]}</button>`).join("");
  document.getElementById("tiles").innerHTML = TILES.map(t => `<a class="tile" href="#${t[0]}"><span class="ico"><svg viewBox="0 0 24 24">${t[1]}</svg></span><div><h3>${t[2][l]}</h3><p>${t[3][l]}</p></div></a>`).join("");
  route(false);
  tick();
}
function route(scroll) {
  const h = (location.hash || "").replace("#", "");
  const t = TILES.filter(x => x[0] === h)[0];
  document.getElementById("v-start").classList.toggle("on", !t);
  document.getElementById("v-page").classList.toggle("on", !!t);
  if (t) {
    document.getElementById("ptitle").textContent = t[2][li()];
    document.getElementById("pbody").innerHTML = PAGES[h](li());
  }
  if (scroll !== false) window.scrollTo(0, 0);
}
function tick() {
  const d = new Date(), loc = {de:"de-CH",en:"en-GB",it:"it-CH",fr:"fr-CH"}[lang];
  document.getElementById("time").textContent = d.toLocaleTimeString(loc, {hour:"2-digit", minute:"2-digit"});
  document.getElementById("date").textContent = d.toLocaleDateString(loc, {weekday:"long", day:"numeric", month:"long"});
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.lang) { lang = b.dataset.lang; save(); render(); }
  else if (b.dataset.f) { const i = favs.indexOf(b.dataset.f); if (i >= 0) favs.splice(i, 1); else favs.push(b.dataset.f); save(); route(false); }
  else if (b.dataset.k) { filt[b.dataset.k] = b.dataset.v; route(false); }
  else if (b.dataset.clear) { favs = []; save(); route(false); }
});
window.addEventListener("hashchange", () => route(true));
render();
setInterval(tick, 20000);
/* Retro-Plakate wechseln alle 10 Sek., Antippen = nächstes */
let pi = 0;
const nextPoster = () => { const ps = document.querySelectorAll(".poster"); ps[pi].classList.remove("on"); pi = (pi + 1) % ps.length; ps[pi].classList.add("on"); };
let pt = setInterval(nextPoster, 10000);
document.querySelector(".scene").addEventListener("click", e => { if (e.target.closest("button")) return; nextPoster(); clearInterval(pt); pt = setInterval(nextPoster, 10000); });

/* Kiosk: nach 3 Min. ohne Berührung zurück zur Startseite */
let idle;
const reset = () => { clearTimeout(idle); idle = setTimeout(() => { if (location.hash) location.hash = ""; }, 180000); };
["touchstart","click"].forEach(ev => document.addEventListener(ev, reset, {passive:true}));
reset();
})();
</script>
